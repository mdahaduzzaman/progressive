<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — Progressive Todos</title>
    <meta name="theme-color" content="#0b1020" />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; }
      body {
        display: grid; place-items: center;
        background: radial-gradient(900px 600px at 20% -10%, #1b2553 0%, transparent 60%), #0b1020;
        color: #e7ecff;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .box { max-width: 420px; }
      h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.01em; }
      p { color: #9aa6cc; margin: 0 0 18px; }
      button {
        background: #5b7dff; color: white; border: none;
        padding: 10px 16px; border-radius: 999px; font-weight: 600;
        cursor: pointer; font-size: 14px;
      }
      .logo {
        width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 14px;
        background: linear-gradient(135deg, #7c9cff, #b48cff);
        display: grid; place-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="logo" aria-hidden>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <path d="M5 12.5l4 4 10-10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>Don't worry — your todos are saved on this device. Reconnect to keep going.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
